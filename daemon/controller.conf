# Rhythm Game Controller Key Mapping Configuration
# Lines starting with # are comments.
# Supported formats:
#   button_<id> = <KEY_NAME>   (id: 0..11)
#   up_<col>    = <KEY_NAME>   (col: 0..3)
#   mid_<col>   = <KEY_NAME>   (col: 0..3)
#   down_<col>  = <KEY_NAME>   (col: 0..3)

# -------------------------------------------------------------
# Row 0: "Up" Row (Buttons 0 - 3)
# -------------------------------------------------------------
button_0 = KEY_Q
button_1 = KEY_W
button_2 = KEY_E
button_3 = KEY_R

# -------------------------------------------------------------
# Row 1: "Middle" Row (Buttons 4 - 7)
# -------------------------------------------------------------
button_4 = KEY_A
button_5 = KEY_S
button_6 = KEY_D
button_7 = KEY_F

# -------------------------------------------------------------
# Row 2: "Down" Row (Buttons 8 - 11)
# -------------------------------------------------------------
button_8  = KEY_Z
button_9  = KEY_X
button_10 = KEY_C
button_11 = KEY_V

# Examples of alternative mappings:
#
# Rhythm / 4-key focused (e.g. D F J K):
# button_4 = KEY_D
# button_5 = KEY_F
# button_6 = KEY_J
# button_7 = KEY_K
#
# Gamepad buttons:
# button_0 = BTN_WEST    # (Square / X)
# button_1 = BTN_NORTH   # (Triangle / Y)
# button_2 = BTN_SOUTH   # (Cross / A)
# button_3 = BTN_EAST    # (Circle / B)
