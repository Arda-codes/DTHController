# DTHController (Digital Twin : Harmonix) Windows Keybindings Configuration
#
# Format: <button_index> = <KEY_NAME>
# Button indices range from 0 to 11 (3 rows of 4 buttons).
#
# Supported key names:
#   A-Z, 0-9, SPACE, ENTER, TAB, LSHIFT, RSHIFT, UP, DOWN, LEFT, RIGHT, ESC, ;

# Row 0: "Up" row
0 = Q
1 = W
2 = E
3 = R

# Row 1: "Middle" row
4 = A
5 = S
6 = D
7 = F

# Row 2: "Down" row
8 = Z
9 = X
10 = C
11 = V
